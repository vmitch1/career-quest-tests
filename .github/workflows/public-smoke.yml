name: Public smoke tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:public -- --browser chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-test-results
          path: reports/
          if-no-files-found: ignore
