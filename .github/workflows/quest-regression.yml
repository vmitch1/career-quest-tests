name: Authenticated quest regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate account configuration
        env:
          CYPRESS_testEmail: ${{ secrets.AQ_TEST_EMAIL }}
          CYPRESS_testPassword: ${{ secrets.AQ_TEST_PASSWORD }}
        run: node scripts/check-credentials.cjs
      - name: Run shared account and both quests
        run: npm test
        env:
          CYPRESS_testEmail: ${{ secrets.AQ_TEST_EMAIL }}
          CYPRESS_testPassword: ${{ secrets.AQ_TEST_PASSWORD }}
          CYPRESS_profileName: ${{ vars.AQ_TEST_PROFILE_NAME || 'Adulting Quest Test Teen' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quest-test-results
          path: reports/
          if-no-files-found: ignore
